apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow privilege escalation
    policies.kyverno.io/category: Platform guardrails
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: Containers must set allowPrivilegeEscalation=false.
spec:
  background: true
  rules:
    - name: disallow-privilege-escalation
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kube-public, kube-node-lease, local-path-storage, argocd, kyverno, monitoring]
      validate:
        failureAction: Enforce
        message: "Set securityContext.allowPrivilegeEscalation=false on every container."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
