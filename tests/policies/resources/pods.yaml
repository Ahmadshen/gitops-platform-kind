apiVersion: v1
kind: Pod
metadata:
  name: compliant
  namespace: podinfo-dev
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/stefanprodan/podinfo:6.15.0
      securityContext:
        allowPrivilegeEscalation: false
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 64Mi }
---
